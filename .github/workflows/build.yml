name: Build

on:
  push:
    branches: main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mps_versions: ${{ steps.mps_versions.outputs.mps_versions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Assemble
        run: ./gradlew --no-daemon --no-parallel assemble
      - name: Output MPS versions
        id: mps_versions
        run: |
          mps_versions=$(jq <gradle.properties --compact-output --raw-input --slurp '
            split("\n")
            | map(select(startswith("supportedMpsVersions=") or startswith("mpsPrereleaseVersion=")) | split("=")[1])
            | (.[0] | split(",")) + [.[1]]
          ')
          echo "mps_versions=$mps_versions" >> "$GITHUB_OUTPUT"

  test:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        mps_version: ${{ fromJSON(needs.assemble.outputs.mps_versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Test
        env:
          MPS_VERSION: ${{ matrix.mps_version }}
        run: ./gradlew --no-daemon --no-parallel "testMps$MPS_VERSION"

  # The job that acts as a required check for pull requests. It must also run when a job it needs fails, because a
  # skipped required check counts as passed.
  build:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: exit 1
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')

  # Publishes projects whose version ends in -SNAPSHOT to the itemis snapshot repository. Projects with a release
  # version are skipped.
  snapshots:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Publish snapshots
        env:
          ARTIFACTS_ITEMIS_CLOUD_USER: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_USER }}
          ARTIFACTS_ITEMIS_CLOUD_PW: ${{ secrets.ARTIFACTS_ITEMIS_CLOUD_PW }}
        run: >-
          ./gradlew --no-daemon --no-parallel
          publishAllPublicationsToItemisSnapshotsRepository
          :launcher:publishAllPublicationsToItemisSnapshotsRepository
