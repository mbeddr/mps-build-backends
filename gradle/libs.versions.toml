[versions]
artifact-transforms-plugin = "1.0.0"
commons-io = "2.13.0"
commons-io-buildscript = "2.19.0"
guava = "33.4.0-jre"
junit-jupiter = "5.10.0"
junit-platform = "1.10.0"
kotlin = "2.1.20"
kotlin-argparser = "2.0.7"
mockito = "[4.11.0,5)"
mps = "2024.3.1"
xmlunit = "2.6.+"

[libraries]
artifact-transforms-gradle-plugin = { module = "com.specificlanguages.mps.artifact-transforms:com.specificlanguages.mps.artifact-transforms.gradle.plugin", version.ref = "artifact-transforms-plugin" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-io-buildscript = { module = "commons-io:commons-io", version.ref = "commons-io-buildscript" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
kotlin-argparser = { module = "com.xenomachina:kotlin-argparser", version.ref = "kotlin-argparser" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin.jvm:org.jetbrains.kotlin.jvm.gradle.plugin", version.ref = "kotlin" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mps = { module = "com.jetbrains:mps", version.ref = "mps" }
xmlunit-core = { module = "org.xmlunit:xmlunit-core", version.ref = "xmlunit" }
